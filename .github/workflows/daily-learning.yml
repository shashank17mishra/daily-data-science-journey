name: Daily Data Science Journey

on:
  schedule:
    # Runs daily at 00:30 UTC (06:00 AM IST)
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode without committing'
        required: false
        type: boolean
        default: false
      custom_date:
        description: 'Specific date (YYYY-MM-DD)'
        required: false
        type: string
        default: ''
      force:
        description: 'Force execution even if task completed'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  daily-task:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          pytest -v --tb=short

      - name: Run Daily Data Science Automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
          START_DATE: ${{ vars.START_DATE || '2026-09-07' }}
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME || 'shashank mishra' }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL || 'shashank17oct2003@gmail.com' }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ -n "${{ inputs.custom_date }}" ]; then
            FLAGS="$FLAGS --date ${{ inputs.custom_date }}"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi

          python -m src.automation.main $FLAGS
