[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-data-science-journey"
version = "1.0.0"
description = "Automated daily Data Science learning repository and coding portfolio."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Data Science Explorer"}
]
dependencies = [
    "google-genai>=0.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "projects"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.pyright]
include = ["src", "learning", "projects", "tests"]
extraPaths = ["."]
